<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes — BINV</title>
<meta name="description" content="생각, 실험, 만드는 과정의 기록.">
<meta property="og:title" content="Notes — BINV">
<meta property="og:description" content="Build Ideas. Nurture Vision.">
<meta property="og:image" content="https://binv.ai/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#070A12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070A12'/%3E%3Cpath d='M18 18 L32 46 L46 18' fill='none' stroke='%233D7BFF' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/site.css">
<style>
  /* List */
  .list { list-style: none; border-top: 1px solid var(--line); }
  .list li { border-bottom: 1px solid var(--line); }
  .list a { display: grid; grid-template-columns: 8rem 1fr; gap: 0.5rem 2rem; padding-block: 1.5rem; text-decoration: none; }
  .list .meta { color: var(--muted); font-size: 0.875rem; padding-top: 0.3rem; }
  .list .meta b { display: block; font-family: var(--display); font-weight: 500; color: var(--blue-soft); font-size: 0.8125rem; }
  .list h2 { font-size: clamp(1.25rem, 2.4vw, 1.5rem); font-weight: 600; line-height: 1.4; }
  .list p { color: var(--muted); margin-top: 0.3rem; max-width: 40em; }
  .list a:hover h2, .list a:focus-visible h2 { color: var(--blue-soft); }

  /* Single note */
  .note { max-width: 40rem; }
  .note .meta { color: var(--muted); font-size: 0.9375rem; margin-bottom: 0.75rem; }
  .note .meta b { font-family: var(--display); font-weight: 500; color: var(--blue-soft); margin-right: 0.75rem; }
  .note h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; }
  .note .horizon { height: 1px; margin: 1.75rem 0 2.5rem; background: linear-gradient(90deg, var(--blue) 0%, var(--blue-soft) 45%, transparent 100%); box-shadow: 0 0 14px 1px rgba(61, 123, 255, 0.5); }
  .body { font-size: 1.125rem; line-height: 1.85; }
  .body > * + * { margin-top: 1.25rem; }
  .body h2 { font-size: 1.375rem; font-weight: 700; line-height: 1.4; margin-top: 3rem; }
  .body h3 { font-size: 1.125rem; font-weight: 700; margin-top: 2rem; }
  .body strong { color: var(--ink); font-weight: 700; }
  .body a { color: var(--blue-soft); }
  .body ul, .body ol { padding-left: 1.4rem; }
  .body li + li { margin-top: 0.4rem; }
  .body blockquote { border-left: 2px solid var(--blue); padding: 0.25rem 0 0.25rem 1.25rem; font-family: var(--display); font-weight: 300; font-size: 1.25rem; line-height: 1.5; }
  .body code { font-size: 0.95em; background: rgba(233, 237, 245, 0.08); padding: 0.1em 0.4em; border-radius: 4px; }
  .body img { max-width: 100%; border-radius: 8px; }
  .body hr { border: 0; border-top: 1px solid var(--line); }
  .back { display: inline-block; margin-top: 4rem; color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
  .back:hover, .back:focus-visible { color: var(--ink); border-color: var(--blue); }

  @media (max-width: 640px) {
    .list a { grid-template-columns: 1fr; gap: 0.25rem; }
    .list .meta b { display: inline; margin-right: 0.75rem; }
  }
</style>
</head>
<body>

<header class="wrap bar">
  <a class="mark" href="/">BINV</a>
  <nav aria-label="사이트 메뉴">
    <a href="/now">Now</a>
    <a href="/ideas">Ideas</a>
    <a href="/notes" aria-current="page">Notes</a>
  </nav>
</header>

<main class="wrap" id="main">
  <p class="notice" id="notice" hidden>지금은 내용을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</p>
</main>

<footer>
  <div class="wrap">
    <span>BINV — Build Ideas. Nurture Vision.</span>
    <a href="mailto:hello@binv.ai">hello@binv.ai</a>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
  const main = document.getElementById("main");
  const slug = new URLSearchParams(location.search).get("n");

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function fail() { document.getElementById("notice").hidden = false; }

  function renderList(notes) {
    const head = el("div", "head");
    head.append(el("h1", "", "Notes"));
    const hz = el("div", "horizon"); hz.setAttribute("aria-hidden", "true"); head.append(hz);
    head.append(el("p", "", "생각, 실험, 만드는 과정의 기록입니다. SNS에 올린 글의 원문이 이곳에 쌓입니다."));
    main.prepend(head);

    const ul = el("ul", "list");
    notes.forEach(n => {
      const li = el("li");
      const a = el("a"); a.href = "/notes?n=" + encodeURIComponent(n.slug);
      const meta = el("div", "meta");
      meta.append(el("b", "", n.series || ""), document.createTextNode(n.date || ""));
      const txt = el("div");
      txt.append(el("h2", "", n.title || ""));
      if (n.summary) txt.append(el("p", "", n.summary));
      a.append(meta, txt); li.append(a); ul.append(li);
    });
    if (!notes.length) ul.append(el("li", "notice", "첫 기록을 준비하고 있어요."));
    main.append(ul);
  }

  function renderNote(n, md) {
    document.title = n.title + " — BINV";
    const art = el("article", "note");
    art.style.paddingTop = "clamp(3rem, 8vw, 5rem)";
    const meta = el("p", "meta");
    meta.append(el("b", "", n.series || ""), document.createTextNode(n.date || ""));
    art.append(meta, el("h1", "", n.title));
    const hz = el("div", "horizon"); hz.setAttribute("aria-hidden", "true"); art.append(hz);
    const body = el("div", "body");
    body.innerHTML = DOMPurify.sanitize(marked.parse(md));
    art.append(body);
    const back = el("a", "back", "모든 기록 보기"); back.href = "/notes";
    art.append(back);
    main.append(art);
  }

  fetch("/binv-data.json", { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      const notes = (Array.isArray(data.notes) ? data.notes : [])
        .slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      if (!slug) return renderList(notes);
      const n = notes.find(x => x.slug === slug);
      if (!n) { main.append(el("p", "notice", "찾는 기록이 없어요.")); return; }
      return fetch("/posts/" + encodeURIComponent(n.slug) + ".md", { cache: "no-cache" })
        .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(md => renderNote(n, md));
    })
    .catch(fail);
</script>
</body>
</html>
