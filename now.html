<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Now — BINV</title>
<meta name="description" content="BIN이 지금 집중하고 있는 것들.">
<meta property="og:title" content="Now — BINV">
<meta property="og:description" content="What I'm focused on right now.">
<meta property="og:image" content="https://binv.ai/binv-header.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#070A12">
<link rel="canonical" href="https://binv.ai/now">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/site.css">
<style>
  .groups { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--line); }
  .group { padding: clamp(1.75rem, 4vw, 2.75rem) 0; border-bottom: 1px solid var(--line); }
  .group:nth-child(odd) { padding-right: clamp(1.5rem, 4vw, 3rem); }
  .group:nth-child(even) { padding-left: clamp(1.5rem, 4vw, 3rem); border-left: 1px solid var(--line); }
  .group h2 { font-family: var(--display); font-weight: 500; font-size: 1rem; color: var(--blue-soft); }
  .group .desc { color: var(--muted); font-size: 0.9375rem; margin-bottom: 1rem; }
  .group ul { list-style: none; }
  .group li { font-size: clamp(1.125rem, 2vw, 1.3125rem); font-weight: 500; line-height: 1.45; padding-block: 0.4rem; }
  .about-now { margin-top: 2.5rem; color: var(--muted); font-size: 0.9375rem; max-width: 40em; }
  @media (max-width: 720px) {
    .groups { grid-template-columns: 1fr; }
    .group:nth-child(odd), .group:nth-child(even) { padding-left: 0; padding-right: 0; border-left: 0; }
  }
</style>
</head>
<body>

<header class="wrap bar">
  <a class="mark" href="/"><img src="/binv-profile.jpg" alt="" width="36" height="36">BINV</a>
  <nav aria-label="사이트 메뉴">
    <a href="/now" aria-current="page">Now</a>
    <a href="/ideas">Ideas</a>
    <a href="/notes">Notes</a>
  </nav>
</header>

<main class="wrap">
  <div class="head">
    <h1>Now</h1>
    <div class="horizon" aria-hidden="true"></div>
    <p>지금 집중하고 있는 것들입니다. 한 달에 한 번쯤 업데이트합니다.</p>
    <p class="updated" id="updated"></p>
  </div>

  <div class="groups" id="groups"></div>
  <p class="notice" id="notice" hidden>지금은 내용을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</p>

  <p class="about-now">Now 페이지는 경력이나 소개 대신, 이 사람이 요즘 무엇에 시간을 쓰고 있는지를 보여주는 페이지입니다.</p>
</main>

<footer>
  <div class="wrap">
    <span>BINV — Build Ideas. Nurture Vision.</span>
    <a href="mailto:hello@binv.ai">hello@binv.ai</a>
  </div>
</footer>

<script>
  const GROUPS = [
    { key: "building", label: "Building", desc: "진행 중인 프로젝트" },
    { key: "learning", label: "Learning", desc: "배우고 있는 것" },
    { key: "thinking", label: "Thinking", desc: "고민하고 있는 질문" },
    { key: "creating", label: "Creating", desc: "만들고 있는 콘텐츠" }
  ];

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  fetch("/binv-data.json", { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      if (data.updated) document.getElementById("updated").textContent = "Updated " + data.updated;
      const box = document.getElementById("groups");
      GROUPS.forEach(g => {
        const items = (data.now && data.now[g.key]) || [];
        if (!items.length) return;
        const sec = el("section", "group");
        sec.append(el("h2", "", g.label), el("p", "desc", g.desc));
        const ul = el("ul");
        items.forEach(t => ul.append(el("li", "", t)));
        sec.append(ul);
        box.append(sec);
      });
    })
    .catch(() => { document.getElementById("notice").hidden = false; });
</script>
</body>
</html>
